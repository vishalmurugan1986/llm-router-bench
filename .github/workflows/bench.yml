name: Router Bench CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Install deps
        run: pip install -e ".[dev]"
      - name: Unit tests
        run: pytest tests/ -v
      - name: Run bench (mock judge, offline)
        env:
          NVIDIA_API_KEY: ${{ secrets.NVIDIA_API_KEY }}
        run: python -m bench.run_matrix --judge-mode mock --offline
      - name: Generate report
        run: python -m dashboard.report
      - name: Upload report
        uses: actions/upload-artifact@v4
        with:
          name: router-report
          path: results/router_reports/latest.md
